<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoken</title>
<style>
@font-face{font-family:"Inter";src:url("__INTER__") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
:root{--bg:rgb(251,251,253);--ink:rgb(10,12,17);--accent:#5566E8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{cursor:default;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden}
#slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:128px}
#row{display:flex;flex-direction:row;align-items:center;gap:56px}
#logo{width:296px;height:180px;display:block;object-fit:contain}
#word{font-family:Inter,Arial,sans-serif;font-size:260px;font-weight:600;line-height:1;color:var(--ink);letter-spacing:-10px;white-space:pre}
#phone{position:absolute;width:436px;height:913px;border-radius:66px;background:#0A0C11;padding:13px;opacity:0;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 50px 90px -30px rgba(10,12,17,.35),0 18px 36px -18px rgba(10,12,17,.25)}
#screen{width:410px;height:887px;border-radius:53px;overflow:hidden;background:#F6F7FA}
#screen img{display:block;width:100%;height:100%}
#tag{position:absolute;font-family:Inter,Arial,sans-serif;font-weight:600;font-size:96px;line-height:1.08;letter-spacing:-3.5px;color:var(--ink);white-space:pre}
#tag .b{color:var(--accent)}
#caret{display:inline-block;width:6px;height:.86em;margin-left:6px;background:var(--accent);vertical-align:-.07em;border-radius:2px}
#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
</style>
</head>
<body>
<div id="stage" aria-live="polite">
  <div id="slide"><div id="row">
    <img id="logo" alt="Spoken logo" draggable="false" src="__LOGO__">
    <div id="word" role="heading" aria-level="1">Spoken</div>
  </div></div>
  <div id="phone" aria-hidden="true"><div id="screen"><img id="shot" alt="Spoken under en samtale med Løkka Pizza" src="__SHOT__"></div></div>
  <div id="tag" aria-label="Du skriver, vi snakker."><span id="t1"></span><span class="b" id="t2"></span><span id="caret"></span></div>
  <canvas id="fx"></canvas>
</div>
<script>
(() => {
"use strict";
const W = 1920, H = 1080;
const INK = [10, 12, 17];
const TAG1 = "Du skriver,\n", TAG2 = "vi snakker.";

// Screen geometry (stage px). The screenshot is 780×1688; the phone has a 13px bezel.
const SCR_W = 410, SCR_H = 887, BEZEL = 13, IMG_W = 780;
const PH_W = SCR_W + 2 * BEZEL, PH_H = SCR_H + 2 * BEZEL;
const K = SCR_W / IMG_W;

// Timeline, seconds after the trigger.
const T = { outline: 0.34, sweep: 0.5, flowEnd: 2.7, gatherJit: 0.35, gather: 1.05, fillA: 4.2, fillB: 4.85, fadeA: 4.4, fadeB: 5.15, typeA: 4.8, typeStep: 0.042 };
const TARGETS = 2500;
const T_END = T.typeA + (TAG1.length + TAG2.length) * T.typeStep + 0.2;

const $ = (id) => document.getElementById(id);
const stage = $("stage"), slide = $("slide"), phone = $("phone"), tag = $("tag"), t1 = $("t1"), t2 = $("t2"), caret = $("caret");
const canvas = $("fx"), ctx = canvas.getContext("2d");
let reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);

let scale = 1, dpr = 1;
let glyphs = null;
const work = document.createElement("canvas");          // 2× raster of the title slide's logo + wordmark
let PX = 0, PY = 0;         // phone top-left
let state = "loading";      // loading | idle | playing | done
let pending = false, t0 = 0, raf = 0;
let thinTrails = 1, slowFrames = 0, lastFrame = 0;   // live-only quality guard; seek() always renders full

// ---------- utilities ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const outBack = (x, c1 = 1.15) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
function wrapNear(a, ref) { while (a - ref > Math.PI / 2) a -= Math.PI; while (ref - a > Math.PI / 2) a += Math.PI; return a; }

function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  stage.style.transform = `translate(${(innerWidth - W * scale) / 2}px,${(innerHeight - H * scale) / 2}px) scale(${scale})`;
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  if (state !== "loading") render(currentT());
}

function stageRect(el) {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: (r.left - s.left) / scale, y: (r.top - s.top) / scale, w: r.width / scale, h: r.height / scale };
}

// Poisson-ish thinning: keep candidates (already shuffled) that are at least r apart.
function thin(cands, r, limit = Infinity) {
  const cell = r, grid = new Map(), out = [];
  const key = (i, j) => i * 100003 + j;
  for (const c of cands) {
    const i = Math.floor(c.x / cell), j = Math.floor(c.y / cell);
    let ok = true;
    for (let di = -1; di <= 1 && ok; di++) for (let dj = -1; dj <= 1 && ok; dj++) {
      const g = grid.get(key(i + di, j + dj));
      if (g) for (const o of g) if ((o.x - c.x) ** 2 + (o.y - c.y) ** 2 < r * r) { ok = false; break; }
    }
    if (!ok) continue;
    const k = key(i, j); (grid.get(k) || grid.set(k, []).get(k)).push(c);
    out.push(c);
    if (out.length >= limit) break;
  }
  return out;
}
function shuffle(a, rand) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- sources: the title slide's own outlines ----------
function buildGlyphs(logoImg) {
  const S = 2, g = document.createElement("canvas");
  g.width = W * S; g.height = H * S;
  const c = g.getContext("2d", { willReadFrequently: true });
  const lr = stageRect($("logo")), wr = stageRect($("word"));
  c.setTransform(S, 0, 0, S, 0, 0);
  c.drawImage(logoImg, lr.x, lr.y, lr.w, lr.h);
  c.font = "600 260px Inter";
  c.letterSpacing = "-10px";
  c.fillStyle = "rgb(10,12,17)";
  c.textBaseline = "alphabetic";
  const m = c.measureText("Spoken");
  const asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
  c.fillText("Spoken", wr.x, Math.floor(wr.y + (260 - (asc + desc)) / 2 + asc));
  return { canvas: g, S, box: { x: lr.x - 10, y: Math.min(lr.y, wr.y) - 40, w: wr.x + wr.w - lr.x + 40, h: Math.max(lr.h, wr.h) + 80 } };
}

function sampleSources(G, rand) {
  const { canvas: g, S, box } = G;
  const x0 = Math.floor(box.x * S), y0 = Math.floor(box.y * S), w = Math.ceil(box.w * S), h = Math.ceil(box.h * S);
  const d = g.getContext("2d").getImageData(x0, y0, w, h).data;
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
  const edge = [], fill = [];
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const a = A(x, y);
    if (a < 128) continue;
    if (A(x - 1, y) < 128 || A(x + 1, y) < 128 || A(x, y - 1) < 128 || A(x, y + 1) < 128) {
      const gx = A(x + 1, y - 1) + 2 * A(x + 1, y) + A(x + 1, y + 1) - A(x - 1, y - 1) - 2 * A(x - 1, y) - A(x - 1, y + 1);
      const gy = A(x - 1, y + 1) + 2 * A(x, y + 1) + A(x + 1, y + 1) - A(x - 1, y - 1) - 2 * A(x, y - 1) - A(x + 1, y - 1);
      edge.push({ x: (x0 + x) / S, y: (y0 + y) / S, a: Math.atan2(gy, gx) + Math.PI / 2, kind: 0 });
    } else if (x % 30 === 0 && y % 30 === 0) {
      // interior hatch, only well inside the ink
      const r = 7;
      if (A(x - r, y) > 200 && A(x + r, y) > 200 && A(x, y - r) > 200 && A(x, y + r) > 200)
        fill.push({ x: (x0 + x) / S + (rand() - 0.5) * 3, y: (y0 + y) / S + (rand() - 0.5) * 3, a: -0.62, kind: 1 });
    }
  }
  const contour = thin(shuffle(edge, rand), 8.5);
  STATS.contour = contour.length; STATS.hatch = fill.length;
  return contour.concat(fill);
}

// ---------- targets: the real app screen's edges ----------
function rr(x, y, w, h, r) { return { t: "rr", x, y, w, h, r }; }
function circ(cx, cy, r) { return { t: "c", cx, cy, r }; }
// Outlines measured on site/shots/no-light-live.webp (780×1688 px).
const SHAPES = [
  circ(702, 78, 38),                      // hang up
  rr(42, 156, 696, 250, 44),              // call card
  circ(138, 254, 88), circ(138, 254, 56), // caller avatar + ring
  circ(642, 256, 56),                     // Spoken mark
  rr(40, 412, 361, 81, 30),               // bubble
  rr(124, 564, 616, 282, 40),             // Spoken bubble
  rr(40, 915, 327, 94, 36),
  rr(124, 1080, 616, 138, 40),
  rr(40, 1289, 615, 142, 40),
  rr(40, 1485, 227, 58, 29), rr(280, 1485, 133, 58, 29), // quick replies
  rr(40, 1561, 698, 101, 50),             // composer
  rr(656, 1580, 72, 72, 16),              // send
];

function perimeter(sh, step) {
  const pts = [];
  if (sh.t === "c") {
    const n = Math.max(8, Math.round(2 * Math.PI * sh.r / step));
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; pts.push({ x: sh.cx + Math.cos(a) * sh.r, y: sh.cy + Math.sin(a) * sh.r, a: a + Math.PI / 2 }); }
    return pts;
  }
  const { x, y, w, h } = sh, r = Math.min(sh.r, w / 2, h / 2);
  const segs = [
    ["l", x + r, y, x + w - r, y], ["a", x + w - r, y + r, -Math.PI / 2],
    ["l", x + w, y + r, x + w, y + h - r], ["a", x + w - r, y + h - r, 0],
    ["l", x + w - r, y + h, x + r, y + h], ["a", x + r, y + h - r, Math.PI / 2],
    ["l", x, y + h - r, x, y + r], ["a", x + r, y + r, Math.PI],
  ];
  for (const s of segs) {
    if (s[0] === "l") {
      const len = Math.hypot(s[3] - s[1], s[4] - s[2]);
      if (len < step * 0.6) continue;
      const n = Math.max(1, Math.round(len / step)), a = Math.atan2(s[4] - s[2], s[3] - s[1]);
      for (let i = 0; i < n; i++) pts.push({ x: s[1] + (s[3] - s[1]) * (i + 0.5) / n, y: s[2] + (s[4] - s[2]) * (i + 0.5) / n, a });
    } else {
      const n = Math.max(2, Math.round((Math.PI / 2) * r / step));
      for (let i = 0; i < n; i++) { const a = s[3] + (Math.PI / 2) * (i + 0.5) / n; pts.push({ x: s[1] + Math.cos(a) * r, y: s[2] + Math.sin(a) * r, a: a + Math.PI / 2 }); }
    }
  }
  return pts;
}

function sampleTargets(shotImg, need, rand) {
  const SX = PX + BEZEL, SY = PY + BEZEL;
  const out = [];
  // phone body + glass first: they frame everything
  for (const p of perimeter(rr(PX, PY, PH_W, PH_H, 66), 8.5)) out.push({ ...p, len: 8, col: 0 });
  // UI containers, mapped from image px into the phone
  const toStage = (p) => ({ x: SX + p.x * K, y: SY + p.y * K, a: p.a });
  for (const sh of SHAPES) for (const p of perimeter(sh, 9 / K)) out.push({ ...toStage(p), len: 8, col: -1 });

  // edges inside the screenshot (text, bars, icons) via Sobel on a 2× raster
  const S = 2, w = Math.round(SCR_W * S), h = Math.round(SCR_H * S);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const cx = c.getContext("2d", { willReadFrequently: true });
  cx.drawImage(shotImg, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;
  const L = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) L[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  const cands = [];
  for (let y = 2; y < h - 2; y++) for (let x = 2; x < w - 2; x++) {
    const i = y * w + x;
    const gx = L[i - w + 1] + 2 * L[i + 1] + L[i + w + 1] - L[i - w - 1] - 2 * L[i - 1] - L[i + w - 1];
    const gy = L[i + w - 1] + 2 * L[i + w] + L[i + w + 1] - L[i - w - 1] - 2 * L[i - w] - L[i - w + 1];
    const m = Math.hypot(gx, gy);
    if (m > 260) cands.push({ x: SX + x / S, y: SY + y / S, a: Math.atan2(gy, gx) + Math.PI / 2, m });
  }
  STATS.structure = out.length;
  const remain = Math.max(0, need - out.length);
  const edges = thin(shuffle(cands, rand), 3.4, remain);
  for (const e of edges) out.push({ x: e.x, y: e.y, a: e.a, len: 4.6, col: -1 });

  // land in the app's own colour where it is saturated (send button, Spoken mark, hang up)
  for (const p of out) {
    if (p.col !== -1) continue;
    const ix = Math.round((p.x - SX) * S), iy = Math.round((p.y - SY) * S);
    let best = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const xx = clamp(ix + dx, 0, w - 1), yy = clamp(iy + dy, 0, h - 1), j = (yy * w + xx) * 4;
      const r = d[j], g = d[j + 1], b = d[j + 2];
      if (b > r + 50 && b > g + 30) best = Math.max(best, 1);
      else if (r > g + 70 && r > b + 50) best = 2;
    }
    p.col = best;
  }
  STATS.edges = edges.length; STATS.edgeCands = cands.length;
  return out;
}

const STATS = {};
const PALETTE = [INK, [85, 102, 232], [214, 58, 62]];

function build(logoImg, shotImg) {
  const rand = rng(20261108);
  glyphs = buildGlyphs(logoImg);
  const src = sampleSources(glyphs, rand).sort((a, b) => a.x - b.x || a.y - b.y);
  const dst = sampleTargets(shotImg, TARGETS, rand);
  const N = src.length, xmin = src[0].x, xmax = src[N - 1].x;
  const PC = { x: PX + PH_W / 2, y: PY + PH_H / 2 };

  strands = src.map((s) => {
    const rank = (s.x - xmin) / (xmax - xmin);
    const speed = 330 + rand() * 230;
    return {
      x0: s.x, y0: s.y, a0: s.a, l0: s.kind ? 8 : 8.5,
      rel: T.outline + rank * T.sweep + rand() * 0.08,
      g0: T.flowEnd + rand() * T.gatherJit,
      speed, td: (80 + 320 * Math.pow(rand(), 1.6)) / speed,
      col: rand() < 0.1 ? 1 : 0,
    };
  });

  simulate(rand);

  // Targets in reading order (rows, snaking), cut into one small cluster per strand: each strand lands a patch of edge.
  const ROW = 14;
  dst.sort((a, b) => {
    const ra = Math.floor(a.y / ROW), rb = Math.floor(b.y / ROW);
    return ra - rb || (ra % 2 ? b.x - a.x : a.x - b.x);
  });
  const clusters = [];
  for (let j = 0; j < N; j++) {
    const pts = dst.slice(Math.floor(j * dst.length / N), Math.floor((j + 1) * dst.length / N));
    const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length, cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    clusters.push({ cx, cy, pts, ang: Math.atan2(cy - PC.y, cx - PC.x) });
  }
  // Strands come home from the side they are on when the gather starts: radial, no crossings.
  const order = strands.map((s, i) => { const p = fAt(i, s.g0); return { i, ang: Math.atan2(p[1] - PC.y, p[0] - PC.x) }; }).sort((a, b) => a.ang - b.ang);
  clusters.sort((a, b) => a.ang - b.ang);
  order.forEach((o, k) => { const c = clusters[k], s = strands[o.i]; s.cx = c.cx; s.cy = c.cy; s.pts = c.pts; });
  STATS.strands = N; STATS.targets = dst.length;
}

// ---------- flow field: curl of Perlin noise + an elliptical vortex around the screen ----------
const DT = 1 / 120;
const SIM_T = T.flowEnd + T.gatherJit + T.gather + 0.1;
const NS = Math.ceil(SIM_T / DT) + 1;
let strands = null, F = null;
const perm = new Uint8Array(512);

function noise(x, y) {
  const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y;
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const g = (h, dx, dy) => { switch (h & 7) { case 0: return dx + dy; case 1: return dx - dy; case 2: return -dx + dy; case 3: return -dx - dy; case 4: return dx; case 5: return -dx; case 6: return dy; default: return -dy; } };
  const xi = X & 255, yi = Y & 255;
  const aa = perm[perm[xi] + yi], ab = perm[perm[xi] + yi + 1], ba = perm[perm[xi + 1] + yi], bb = perm[perm[xi + 1] + yi + 1];
  const u = fade(xf), v = fade(yf);
  const x1 = g(aa, xf, yf) + u * (g(ba, xf - 1, yf) - g(aa, xf, yf));
  const x2 = g(ab, xf, yf - 1) + u * (g(bb, xf - 1, yf - 1) - g(ab, xf, yf - 1));
  return x1 + v * (x2 - x1);
}

function simulate(rand) {
  const p = Array.from({ length: 256 }, (_, i) => i);
  shuffle(p, rand);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const FS = 1 / 360, E = 0.01, A = 960, B = 540, CX = 960, CY = 540;
  F = new Float32Array(strands.length * NS * 2);
  strands.forEach((s, i) => {
    let x = s.x0, y = s.y0;
    const base = i * NS * 2;
    for (let k = 0; k < NS; k++) {
      const tau = k * DT;
      if (tau > s.rel) {
        const age = tau - s.rel, sp = s.speed * smooth(age / 0.45);
        const nx = x * FS + tau * 0.11, ny = y * FS - tau * 0.07;
        let vx = 1.25 * (noise(nx, ny + E) - noise(nx, ny - E)) / (2 * E);
        let vy = -1.25 * (noise(nx + E, ny) - noise(nx - E, ny)) / (2 * E);
        const dx = x - CX, dy = y - CY, gx = dx / (A * A), gy = dy / (B * B), gl = Math.hypot(gx, gy) || 1;
        const rho = Math.hypot(dx / A, dy / B);
        vx += 0.95 * (-gy / gl) - (gx / gl) * (rho - 0.74) * 2.2;   // orbit + pull towards a ring that spans the screen
        vy += 0.95 * (gx / gl) - (gy / gl) * (rho - 0.74) * 2.2;
        vy -= 1.3 * (1 - smooth(age / 0.6));                        // lift off the slide first
        const m = Math.hypot(vx, vy) || 1;
        x += (vx / m) * sp * DT; y += (vy / m) * sp * DT;
      }
      F[base + k * 2] = x; F[base + k * 2 + 1] = y;
    }
  });
}

const _p = [0, 0];
function fAt(i, tau) {
  const k = clamp(tau / DT, 0, NS - 1), k0 = Math.floor(k), k1 = Math.min(NS - 1, k0 + 1), f = k - k0, b = i * NS * 2;
  _p[0] = F[b + k0 * 2] + (F[b + k1 * 2] - F[b + k0 * 2]) * f;
  _p[1] = F[b + k0 * 2 + 1] + (F[b + k1 * 2 + 1] - F[b + k0 * 2 + 1]) * f;
  return _p;
}
// Free flight, then a gather that bends the strand onto its landing point and lets it settle with a small overshoot.
function posAt(i, s, tau) {
  const p = fAt(i, tau);
  if (tau <= s.g0) return p;
  const e = outBack(smooth((tau - s.g0) / T.gather), 0.9);
  p[0] += (s.cx - p[0]) * e; p[1] += (s.cy - p[1]) * e;
  return p;
}

// ---------- rendering ----------
const BUCKETS_A = 6, TAIL = [1, 0.78, 0.58, 0.4, 0.24, 0.11];
const buckets = Array.from({ length: 3 * (BUCKETS_A + 1) }, () => []);
const trails = Array.from({ length: 2 * TAIL.length }, () => []);

function drawGlyphFill(t) {
  // The ink drains out of the letters in the same left-to-right sweep the lines leave in.
  const { canvas: g, S, box } = glyphs;
  const k = scale * dpr, wc = work;
  const ww = Math.ceil(box.w * k), wh = Math.ceil(box.h * k);
  if (wc.width !== ww || wc.height !== wh) { wc.width = ww; wc.height = wh; }
  const c = wc.getContext("2d");
  c.globalCompositeOperation = "copy";
  c.drawImage(g, box.x * S, box.y * S, box.w * S, box.h * S, 0, 0, ww, wh);
  c.globalCompositeOperation = "destination-in";
  const grad = c.createLinearGradient(0, 0, ww, 0);
  for (let i = 0; i <= 24; i++) {
    const r = i / 24;
    grad.addColorStop(r, `rgba(0,0,0,${clamp((1 - 0.78 * smooth(t / T.outline)) * (1 - smooth((t - (T.outline - 0.05 + r * T.sweep)) / 0.3))).toFixed(3)})`);
  }
  c.fillStyle = grad; c.fillRect(0, 0, ww, wh);
  c.globalCompositeOperation = "source-over";
  ctx.drawImage(wc, box.x, box.y, box.w, box.h);
}

function drawLines(t, fade) {
  for (const b of buckets) b.length = 0;
  for (const b of trails) b.length = 0;
  const appear = smooth(t / T.outline);
  const pushStroke = (col, alpha, x, y, a, len) => {
    if (alpha <= 0.01) return;
    const c = Math.cos(a) * len / 2, sn = Math.sin(a) * len / 2;
    buckets[col * (BUCKETS_A + 1) + Math.round(clamp(alpha) * BUCKETS_A)].push(x - c, y - sn, x + c, y + sn);
  };
  for (let i = 0; i < strands.length; i++) {
    const s = strands[i];
    // the slide's own stroke, until the strand pulls out of it
    const leave = smooth((t - s.rel) / 0.16);
    if (leave < 1) pushStroke(0, appear * 0.92 * (1 - leave) * fade, s.x0, s.y0, s.a0, s.l0);
    const land = s.g0 + T.gather, snap = clamp((t - (land - 0.16)) / 0.3);
    // trail: the strand's own recent path, shortening as it gathers so it straightens into its landing
    if (t > s.rel && snap < 1 && (i % thinTrails === 0)) {
      const td = s.td * (1 - smooth((t - s.g0) / (0.6 * T.gather))) * smooth((t - s.rel) / 0.25) + 0.02;
      const m = Math.max(3, Math.ceil(td * 40) + 1), alpha = 0.88 * (1 - smooth(snap * 1.4)) * fade;
      if (alpha > 0.01) {
        const per = (m - 1) / TAIL.length;
        for (let c = 0; c < TAIL.length; c++) {
          const from = Math.floor(c * per), to = Math.min(m - 1, Math.ceil((c + 1) * per));
          if (to <= from) continue;
          const out = trails[s.col * TAIL.length + c];
          out.push(NaN);
          for (let k = from; k <= to; k++) { const p = posAt(i, s, Math.max(s.rel, t - td * k / (m - 1))); out.push(p[0], p[1]); }
        }
      }
    }
    // landing: the strand's patch of app edges snaps out of its head
    if (snap > 0) {
      const q = outBack(snap, 1.4), al = smooth(snap * 1.6) * 0.92 * fade;
      for (const p of s.pts) pushStroke(p.col, al, s.cx + (p.x - s.cx) * q, s.cy + (p.y - s.cy) * q, p.a, p.len * (0.5 + 0.5 * clamp(q)));
    }
  }
  ctx.lineCap = "butt"; ctx.lineJoin = "bevel";
  ctx.lineWidth = 1.25;
  for (let col = 0; col < 2; col++) for (let c = 0; c < TAIL.length; c++) {
    const b = trails[col * TAIL.length + c];
    if (!b.length) continue;
    const p = PALETTE[col];
    ctx.strokeStyle = `rgba(${p[0]},${p[1]},${p[2]},${(0.88 * TAIL[c] * fade).toFixed(3)})`;
    ctx.beginPath();
    let move = true;
    for (let k = 0; k < b.length;) {
      if (Number.isNaN(b[k])) { move = true; k++; continue; }
      if (move) { ctx.moveTo(b[k], b[k + 1]); move = false; } else ctx.lineTo(b[k], b[k + 1]);
      k += 2;
    }
    ctx.stroke();
  }
  ctx.lineCap = "round";
  ctx.lineWidth = 1.5;
  for (let col = 0; col < 3; col++) {
    const p = PALETTE[col];
    for (let ai = 1; ai <= BUCKETS_A; ai++) {
      const b = buckets[col * (BUCKETS_A + 1) + ai];
      if (!b.length) continue;
      ctx.strokeStyle = `rgba(${p[0]},${p[1]},${p[2]},${ai / BUCKETS_A})`;
      ctx.beginPath();
      for (let k = 0; k < b.length; k += 4) { ctx.moveTo(b[k], b[k + 1]); ctx.lineTo(b[k + 2], b[k + 3]); }
      ctx.stroke();
    }
  }
}

function setTagline(t) {
  const n = t < T.typeA ? 0 : Math.floor((t - T.typeA) / T.typeStep) + 1;
  const all = TAG1 + TAG2, k = Math.min(all.length, n);
  t1.textContent = all.slice(0, Math.min(k, TAG1.length));
  t2.textContent = k > TAG1.length ? all.slice(TAG1.length, k) : "";
  const typing = t >= T.typeA - 0.25;
  tag.style.opacity = typing ? 1 : 0;
  // caret blinks once typing is done
  const blink = Math.floor((t - T.typeA) / 0.5) % 2 === 0 ? 1 : 0;
  caret.style.opacity = !typing ? 0 : (n > 0 && k < all.length) ? 1 : blink;
}

function render(t) {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (t < 0) {
    slide.style.opacity = 1; phone.style.opacity = 0; tag.style.opacity = 0;
    return;
  }
  if (reduced) {
    const k = smooth(t / 0.7);
    slide.style.opacity = 1 - k; phone.style.opacity = k; phone.style.transform = "none";
    t1.textContent = TAG1; t2.textContent = TAG2; tag.style.opacity = k; caret.style.opacity = 0;
    return;
  }
  slide.style.opacity = 0;
  if (t < T.outline + T.sweep + 0.4) drawGlyphFill(t);
  const fill = smooth((t - T.fillA) / (T.fillB - T.fillA));
  phone.style.opacity = fill;
  phone.style.transform = `scale(${0.985 + 0.015 * easeOut(fill)})`;
  const fade = 1 - smooth((t - T.fadeA) / (T.fadeB - T.fadeA));
  if (fade > 0) drawLines(t, fade);
  setTagline(t);
}

function currentT() {
  if (state === "idle" || state === "loading") return -1;
  if (state === "done") return Math.max(T_END + 10, (performance.now() - t0) / 1000);
  return (performance.now() - t0) / 1000;
}

function frame(now) {
  const t = currentT();
  if (state === "playing" && lastFrame && t > T.outline + 0.2 && t < T.flowEnd + T.gather) {
    slowFrames = slowFrames * 0.85 + (now - lastFrame) * 0.15;   // EMA of frame time, ms
    if (slowFrames > 21 && thinTrails < 4) { thinTrails++; slowFrames = 16.7; }
  }
  lastFrame = now;
  render(t);
  if (state === "playing" && t > T_END + 0.1) state = "done";
  // keep ticking for the caret blink
  raf = requestAnimationFrame(frame);
}

function play() {
  if (state === "loading") { pending = true; return; }
  if (state !== "idle") return;
  state = "playing"; t0 = performance.now(); thinTrails = 1; slowFrames = 16.7; lastFrame = 0;
}
function reset() { state = state === "loading" ? "loading" : "idle"; pending = false; render(-1); }

addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter" || e.key === "PageDown") { e.preventDefault(); play(); }
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "f" || e.key === "F") { if (state !== "loading") { state = "done"; t0 = performance.now() - (T_END + 10) * 1000; } }
});
addEventListener("click", play);
addEventListener("resize", fit);

// Capture hook: render any moment deterministically (used to export key frames).
window.__intro = { seek(t) { cancelAnimationFrame(raf); state = "paused"; thinTrails = 1; render(t); }, T_END, ready: false, quality: () => thinTrails };

async function init() {
  fit();
  const logoImg = $("logo"), shotImg = $("shot");
  await Promise.all([document.fonts.load("600 260px Inter"), document.fonts.load("600 96px Inter"), logoImg.decode(), shotImg.decode()]);
  await document.fonts.ready;
  // group = phone + gap + tagline, centred on the stage
  t1.textContent = TAG1; t2.textContent = TAG2;
  const tagW = tag.getBoundingClientRect().width / scale, tagH = tag.getBoundingClientRect().height / scale;
  t1.textContent = ""; t2.textContent = "";
  const gap = 128, groupW = PH_W + gap + tagW;
  PX = Math.round((W - groupW) / 2); PY = Math.round((H - PH_H) / 2);
  phone.style.left = PX + "px"; phone.style.top = PY + "px";
  tag.style.left = PX + PH_W + gap + "px"; tag.style.top = Math.round(H / 2 - tagH / 2) + "px";
  tag.style.minHeight = tagH + "px";
  build(logoImg, shotImg);
  state = "idle";
  window.__intro.ready = true; window.__intro.count = strands.length; window.__intro.stats = STATS;
  render(-1);
  raf = requestAnimationFrame(frame);
  if (pending) play();
  else if (params.get("auto") === "1") setTimeout(play, 1200);
}
init().catch((err) => { console.error("intro init failed, using crossfade", err); reduced = true; state = "idle"; raf = requestAnimationFrame(frame); });
})();
</script>
</body>
